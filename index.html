<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <h1>My Store</h1>
    </header>

    <!-- Filters Section -->
    <section class="filters-container">
      <div class="filter-group">
        <input
          type="text"
          id="search-input"
          placeholder="Search for products..."
        />

        <select id="category-select">
          <option value="0" hidden>Categories</option>
          <option value="all">All Products</option>
          <option value="men">Men's clothing</option>
          <option value="women">Women's clothing</option>
          <option value="jewellery">Jewelery</option>
          <option value="electronics">Electronics</option>
        </select>

        <input type="number" id="min-price" placeholder="Min Price" />
        <input type="number" id="max-price" placeholder="Max Price" />

        <button id="apply-filters" class="btn-green">Apply Filters</button>
      </div>

      <div class="sort-group">
        <select id="sort-select">
          <option value="default">Sort by Price</option>
          <option value="low-high">Low to High</option>
          <option value="high-low">High to Low</option>
        </select>
      </div>
    </section>

    <!-- Shopping Cart Section -->
    <section class="cart-section">
      <h2>Shopping Cart</h2>
      <!-- سيتم إضافة العناصر هنا عبر JS -->
      <ul id="cart-items-list">
        <!-- Example Item (Static for demonstration, you can remove it) -->
        <!-- 
            <li>
                <span class="item-name">Samsung 49-Inch CHG90...</span>
                <span class="item-price">$999.99</span>
                <span class="item-qty">2</span>
                <button class="btn-remove">Remove</button>
            </li> 
            -->
      </ul>

      <div class="cart-summary">
        <p>Total Quantity: <span id="total-qty">0</span></p>
        <p>Total Price: $<span id="total-price">0.00</span></p>
      </div>
    </section>

    <!-- Products Grid Section -->
    <section class="products-section">
      <div class="products-grid" id="products-grid">
        <ul class="paginated-list" id="list"></ul>
      </div>
    </section>

    <nav class="pagination-container">
      <button
        class="pagination-button"
        id="prev-button"
        title="Previous page"
        aria-label="Previous page"
      >
        &lt;
      </button>

      <div id="pagination-numbers"></div>

      <button
        class="pagination-button"
        id="next-button"
        title="Next page"
        aria-label="Next page"
      >
        &gt;
      </button>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
